name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  # A run that fails at startup cannot be re-run; this is the way back in
  # (workflow-dispatch-check, just-makeit#1801).
  workflow_dispatch:

# Force uv to use managed (python-build-standalone) interpreters. Under
# setup-uv@v8, `uv run -p X` on macOS would otherwise select the Xcode system
# Python, whose headers aren't where the build looks (no Python.h) — the
# managed builds ship the headers we compile against.
env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  # Has this run anything left to prove? The vendored answer (canonical,
  # HAS_RELEASE): src=false for a tree a merged PR already passed, or a
  # version bump alone; code=false for a docs-only diff. Every job below
  # waits on it -- `make ci-changes-wiring-check` refuses one that does not.
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      checks: read
      contents: read

  # There was no lint job at all before this. Every pre-commit hook, every
  # drift gate and every check in `make lint` ran on NO pull request -- which
  # is worse than not having them, because the repo reads as gated.
  #
  # `make lint` and nothing else: the Makefile is the SSOT for how each tool
  # runs, so a job that re-listed the tools here would be a second copy free to
  # drift -- which is exactly what happened to the test command, where ci.yml
  # passed `--with pip --with numpy` and the Makefile did not, so `make test`
  # could not pass while CI was green.
  lint:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          # changelog-check asserts every release tag has a section, and the
          # default checkout fetches NO tags -- the scan would run over an
          # empty set and report success. It refuses to, so it needs these.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
      - run: make lint

  test:
    needs: changes
    if: needs.changes.outputs.src == 'true' && needs.changes.outputs.code != 'false'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install meson + ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ninja-build && uv tool install meson
      - name: Install meson + ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja && uv tool install meson
      - run: make test TEST_PYTHON=${{ matrix.python-version }}

  test-bazel:
    needs: changes
    if: needs.changes.outputs.src == 'true' && needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y bazel-bootstrap && sudo ln -sf /usr/bin/bazel-bootstrap /usr/local/bin/bazel
      - run: uv run --no-project -p ${{ matrix.python-version }} python -m unittest tests.test_examples.TestBazelExample -v

  test-just-makeit:
    needs: changes
    if: needs.changes.outputs.src == 'true' && needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # just-makeit (the scaffolding CLI) requires Python >=3.11 and its
        # generated projects target >=3.11, so this integration only runs on
        # 3.11+. just-buildit's 3.8+ floor is covered by the test/test-bazel
        # jobs above.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # Pinned: unpinned, a jm release that changed the scaffold layout
      # (0.90.0 moved headers under native/inc/<pkg>/) reddened this job
      # with no change here. Moving the pin is a reviewed PR that updates
      # tests/test_examples.py's _EXPECTED_FILES with it.
      - run: uv tool install just-makeit==0.97.0
      - run: uv run --no-project -p ${{ matrix.python-version }} --with pip --with numpy python -m unittest tests.test_examples.TestJustMakeitExample -v

  test-windows:
    # Windows is clang-cl against native CPython (the MSVC ABI), the same
    # toolchain just-makeit and doppler build with. It replaced an MSYS2
    # UCRT64 / MinGW job. BINDING: it feeds `CI passed`.
    name: test-windows (clang-cl)
    needs: changes
    if: needs.changes.outputs.src == 'true' && needs.changes.outputs.code != 'false'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CC: clang-cl
      # What CMake itself reads, so examples/cmake's plain `cmake -B build`
      # picks up clang-cl and Ninja.
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v6.0.2
      # clang-cl drives the MSVC toolchain and needs its environment
      # (INCLUDE / LIB / the linker). Vendored from canonical.
      - name: MSVC developer environment (x64)
        run: scripts/msvc-env.sh x64
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
      - run: uv run --no-project -p 3.12 python -m unittest tests.test_build tests.test_examples tests.test_cli -v

  # The one check main's ruleset requires -- and it did not exist. The rule
  # named `CI passed`, no job produced it, so `mergeable_state` was `blocked`
  # on every pull request with every check green. A required check that nothing
  # reports is not a strict gate; it is a repository that cannot merge, and it
  # reads as ordinary CI slowness until someone looks at the ruleset.
  #
  # `if: always()` with an explicit failure scan rather than plain `needs:`,
  # so a SKIPPED job does not read as a failure and a failed one cannot be
  # skipped past.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `changes` too: if it fails, nothing below it ran, and that is not a
    # pass. A job it skipped (an already-tested tree) is `skipped`, which is.
    needs:
      [changes, lint, test, test-bazel, test-just-makeit, test-windows]
    if: always()
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi

  trigger-mirror:
    name: Trigger docs mirror refresh
    # Nudges just-buildit.github.io's mirror.yml (repository_dispatch:
    # mirror) to refresh immediately instead of waiting for its daily cron.
    # Never blocks anything else in this repo — not a required check.
    #
    # Hangs off `ci-passed` rather than re-listing the matrix. The comment
    # here used to say no aggregator existed "unlike just-bashit/just-makeit"
    # — which was true, and was also why main's ruleset required a check
    # nothing produced and no pull request could merge.
    needs: ci-passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # always(): with no status function GitHub ANDs in success(), false
    # whenever the matrix was skipped as already tested -- this job was
    # skipped on the first such merge (4aef41a). ci-changes-wiring-check.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-passed.result == 'success'
    steps:
      - name: Dispatch mirror refresh
        env:
          GH_TOKEN: ${{ secrets.MIRROR_DISPATCH_TOKEN }}
        run: |
          gh api repos/just-buildit/just-buildit.github.io/dispatches \
            -f event_type=mirror
